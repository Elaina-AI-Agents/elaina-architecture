name: Source drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-source-heads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare pinned commits with default branches
        run: node scripts/check-source-drift.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
